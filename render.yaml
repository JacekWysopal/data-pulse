services:
  - type: web
    name: data-pulse
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn data_pulse.wsgi:application"
    releaseCommand: "python manage.py migrate"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MONITORED_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"