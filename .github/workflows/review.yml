# AI Code Review workflow — adapted from m5l3-review.yml.template
# Changes from template:
#   - api-key secret: ANTHROPIC_API_KEY (was: LLM_PROVIDER_API_KEY)
#   - Comment step: renders all 6 criterion scores as a Markdown table (F1 fix)
name: AI Code Review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write # labels live on the issues API

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, otherwise there is no base to diff against

      - name: Compute diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/pr.diff"

      - id: review
        # Local composite action (.github/actions/ai-reviewer)
        uses: ./.github/actions/ai-reviewer
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
          diff-file: ${{ runner.temp }}/pr.diff

      - name: Comment and label
        if: always() && steps.review.outputs.verdict != ''
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          REVIEW_FILE: ${{ steps.review.outputs.review-file }}
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(
              "## AI Code Review: " + r.verdict + "\n\n" +
              "| Criterion | Score |\n" +
              "|---|---|\n" +
              "| Implementation Correctness | " + r.implementationCorrectness + " |\n" +
              "| Idiomaticity | " + r.idiomaticity + " |\n" +
              "| Complexity | " + r.complexity + " |\n" +
              "| Test/Risk Coverage | " + r.testRiskCoverage + " |\n" +
              "| Documentation | " + r.documentation + " |\n" +
              "| Security | " + r.securitySafety + " |\n\n" +
              r.summary
            );
          ' "$REVIEW_FILE" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          gh label create ai-cr:passed --color 0E8A16 --force
          gh label create ai-cr:failed --color B60205 --force
          if [ "$VERDICT" = pass ]; then add=ai-cr:passed; drop=ai-cr:failed; else add=ai-cr:failed; drop=ai-cr:passed; fi
          gh pr edit "$PR" --add-label "$add" --remove-label "$drop"
          gh pr edit "$PR" --remove-label ai-cr:review || true

      - name: Gate on verdict
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          test "$VERDICT" = pass || { echo "AI review verdict: ${VERDICT:-missing}"; exit 1; }
