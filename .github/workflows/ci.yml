name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: data-pulse
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: data-pulse
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: 'True'
          DATABASE_URL: ''
          MONITORED_DATABASE_URL: ''
        run: python manage.py test monitor --verbosity=2
