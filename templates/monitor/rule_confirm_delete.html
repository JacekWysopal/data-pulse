{% extends 'base.html' %}
{% block title_suffix %} — Usuń regułę{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{% url 'monitor:dashboard' %}" class="text-muted small">← Dashboard</a>
  <h1 class="h3 mt-1">Usuń regułę</h1>
</div>

<div class="card shadow-sm" style="max-width: 500px;">
  <div class="card-body">
    <p>Czy na pewno chcesz usunąć regułę <strong>{{ rule.name }}</strong>?</p>
    <p class="text-muted small">Tabela: <code>{{ rule.schema_name }}.{{ rule.table_name }}</code></p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">Usuń</button>
        <a href="{% url 'monitor:dashboard' %}" class="btn btn-outline-secondary">Anuluj</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
