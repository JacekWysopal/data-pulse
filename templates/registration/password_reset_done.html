<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataPulse — Password Reset Sent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg-base: #0a0a0f; --bg-card: #16161f; --border-strong: rgba(255,255,255,0.12);
      --accent-hover: #818cf8; --text-primary: #f1f5f9; --text-muted: #4b5563;
      --radius-lg: 14px; --ok: #34d399; --ok-dim: rgba(52,211,153,0.12); }
    html, body { height: 100%; background: var(--bg-base); color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    body::before { content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(99,102,241,0.12) 0%, transparent 60%);
      pointer-events: none; }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; padding: 1.5rem;
      animation: fadeUp 0.4s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 2rem; }
    .logo-icon { width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #818cf8); display: flex; align-items: center;
      justify-content: center; box-shadow: 0 0 24px rgba(99,102,241,0.5); }
    .logo-name { font-size: 1.4rem; font-weight: 800; }
    .logo-name span { background: linear-gradient(135deg, #6366f1, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: var(--bg-card); border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg); padding: 2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6); text-align: center; }
    .check { font-size: 2.5rem; margin-bottom: 1rem; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
    .card-body { font-size: 0.85rem; color: var(--text-muted); line-height: 1.7; }
    .footer { text-align: center; margin-top: 1.25rem; font-size: 0.78rem; color: var(--text-muted); }
    .footer a { color: var(--accent-hover); text-decoration: none; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 22 22" fill="none" width="22" height="22">
        <path d="M3 15 L7 9 L11 12 L15 5 L19 8" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="19" cy="8" r="2" fill="white"/>
      </svg>
    </div>
    <div class="logo-name">Data<span>Pulse</span></div>
  </div>

  <div class="card">
    <div class="check">✉️</div>
    <div class="card-title">Check your email</div>
    <div class="card-body">
      We've sent password reset instructions to your email address.
      If it doesn't arrive soon, check your spam folder.
    </div>
  </div>

  <div class="footer">
    <a href="{% url 'login' %}">Back to sign in</a>
  </div>
</div>
</body>
</html>
